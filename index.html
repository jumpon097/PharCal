    function PharCalcWebApp() {
      const [isDark, setIsDark] = useState(false);
      const [activeTab, setActiveTab] = useState('chap2');
      const [isTocOpenMobile, setIsTocOpenMobile] = useState(false);

      const pdfDownloadUrl = "https://drive.google.com/file/d/1pCb2TKqvuzBXCaNr_Zr0GgFeXhA_Qcvj/view?usp=sharing";

      // --- States บทที่ 2 ถึง 19 ---
      const [c2Moiety, setC2Moiety] = useState('250');
      const [c2MwIngredient, setC2MwIngredient] = useState('456');
      const [c2MwMoiety, setC2MwMoiety] = useState('360');
      const [c2LossOnDrying, setC2LossOnDrying] = useState('0.4');

      const [c3Weight, setC3Weight] = useState('36');
      const [c3WeightUnit, setC3WeightUnit] = useState('lb');
      const [c3DoseRate, setC3DoseRate] = useState('15');
      const [c3DoseFreq, setC3DoseFreq] = useState('2');
      const [c3StockMg, setC3StockMg] = useState('200');
      const [c3StockMl, setC3StockMl] = useState('5');

      // BSA States: เลือกหน่วยอิสระได้
      const [c3BsaTarget, setC3BsaTarget] = useState('human');
      const [c3HeightVal, setC3HeightVal] = useState('74');
      const [c3HeightUnit, setC3HeightUnit] = useState('in');
      const [c3BsaWeightVal, setC3BsaWeightVal] = useState('183');
      const [c3BsaWeightUnit, setC3BsaWeightUnit] = useState('lb');
      const [c3PetWeightG, setC3PetWeightG] = useState('5800');
      const [c3PetType, setC3PetType] = useState('cat');
      const [c3DosePerBsa, setC3DosePerBsa] = useState('375');
      const [c3ConcPerMl, setC3ConcPerMl] = useState('10');

      const [c4TotalUnits, setC4TotalUnits] = useState('1200000');
      const [c4PotencyUnitsPerMg, setC4PotencyUnitsPerMg] = useState('1180');

      const [c6PcntWw, setC6PcntWw] = useState('37');
      const [c6Sg, setC6Sg] = useState('1.18');
      const [c6TargetVolMl, setC6TargetVolMl] = useState('75');

      const [c7Mw, setC7Mw] = useState('388.48');
      const [c7Valence, setC7Valence] = useState('1');
      const [c7DoseMg, setC7DoseMg] = useState('250');

      const [c8Q1, setC8Q1] = useState('60');
      const [c8C1, setC8C1] = useState('10');
      const [c8C2, setC8C2] = useState('5');

      const [c9StockAlc, setC9StockAlc] = useState('95');
      const [c9TargetAlc, setC9TargetAlc] = useState('70');
      const [c9TargetVol, setC9TargetVol] = useState('500');

      const [c10High, setC10High] = useState('70');
      const [c10Low, setC10Low] = useState('30');
      const [c10Target, setC10Target] = useState('50');
      const [c10TotalQty, setC10TotalQty] = useState('500');

      const [c11Sensitivity, setC11Sensitivity] = useState('6');
      const [c11MaxError, setC11MaxError] = useState('5');
      const [c11DrugNeeded, setC11DrugNeeded] = useState('20');
      const [c11TotalMixture, setC11TotalMixture] = useState('1000');

      const [c12TotalVol, setC12TotalVol] = useState('100');
      const [c12WaterAdded, setC12WaterAdded] = useState('68');

      const [c13VolumeMl, setC13VolumeMl] = useState('1000');
      const [c13TimeHours, setC13TimeHours] = useState('8');
      const [c13DropFactor, setC13DropFactor] = useState('15');

      const [c14DrugG, setC14DrugG] = useState('1');
      const [c14EValue, setC14EValue] = useState('0.23');
      const [c14VolMl, setC14VolMl] = useState('100');

      const [c15Pka, setC15Pka] = useState('4.76');
      const [c15Salt, setC15Salt] = useState('0.1');
      const [c15Acid, setC15Acid] = useState('0.1');

      const [c16Temp, setC16Temp] = useState('25');
      const [c16Scale, setC16Scale] = useState('C');

      const [c17K, setC17K] = useState('5');
      const [c17M, setC17M] = useState('10');

      const [c18Order, setC18Order] = useState('1');
      const [c18K, setC18K] = useState('0.005');
      const [c18C0, setC18C0] = useState('100');

      const [c19Temps, setC19Temps] = useState('25, 28, 30, 26, 24, 29');

      // --- Navigation Tabs ---
      const navTabs = [
        { id: 'chap1', label: 'บทที่ 1: บทนำ USP <1160>', icon: Icons.FileText },
        { id: 'chap2', label: 'บทที่ 2: ปริมาณตัวยา (W=AB/CD)', icon: Icons.FlaskConical },
        { id: 'chap3w', label: 'บทที่ 3.1: ขนาดยาตามน้ำหนัก', icon: Icons.Scale },
        { id: 'chap3b', label: 'บทที่ 3.2: ขนาดยาตาม BSA', icon: Icons.Activity },
        { id: 'chap4', label: 'บทที่ 4: Potency Units', icon: Icons.Sparkles },
        { id: 'chap5', label: 'บทที่ 5: ผลรวมปริมาตรและน้ำหนัก', icon: Icons.Info },
        { id: 'chap6', label: 'บทที่ 6: Density & SG', icon: Icons.Droplets },
        { id: 'chap7', label: 'บทที่ 7: mEq & mmol', icon: Icons.Layers },
        { id: 'chap8', label: 'บทที่ 8: เจือจาง (Q1C1=Q2C2)', icon: Icons.FlaskConical },
        { id: 'chap9', label: 'บทที่ 9: แอลกอฮอล์ & Proof', icon: Icons.Droplets },
        { id: 'chap10', label: 'บทที่ 10: Alligation Alternate', icon: Icons.Grid },
        { id: 'chap11', label: 'บทที่ 11: Aliquot Dilution', icon: Icons.Zap },
        { id: 'chap12', label: 'บทที่ 12: ปริมาตรผงยาแทนที่', icon: Icons.Layers },
        { id: 'chap13', label: 'บทที่ 13: IV Flow Rate', icon: Icons.Timer },
        { id: 'chap14', label: 'บทที่ 14: โทนิซิตี & E-Value', icon: Icons.Droplets },
        { id: 'chap15', label: 'บทที่ 15: pH บัฟเฟอร์ (H-H)', icon: Icons.Gauge },
        { id: 'chap16', label: 'บทที่ 16: แปลงอุณหภูมิ', icon: Icons.Thermometer },
        { id: 'chap17', label: 'บทที่ 17: เอนโดท็อกซิน (K/M)', icon: Icons.ShieldAlert },
        { id: 'chap18', label: 'บทที่ 18: เสถียรภาพ & t90', icon: Icons.Clock },
        { id: 'chap19', label: 'บทที่ 19: อุณหภูมิเฉลี่ยจลน์ (MKT)', icon: Icons.Thermometer },
        { id: 'chap20', label: 'บทที่ 20: ภาคผนวก', icon: Icons.FileText },
        { id: 'chap21', label: 'บทที่ 21: บทสรุป', icon: Icons.BookOpen }
      ];

      const tocList = [
        { num: 1, title: 'บทนำ (Introduction)', pages: '1-5', tabRef: 'chap1' },
        { num: 2, title: 'ปริมาณสารออกฤทธิ์ (Active Ingredients)', pages: '6-28', tabRef: 'chap2' },
        { num: 3, title: 'การให้ยาตามน้ำหนัก และ พื้นที่ผิวกาย', pages: '29-43', tabRef: 'chap3w' },
        { num: 4, title: 'หน่วยความแรงทางชีวภาพ (Potency Units)', pages: '44-47', tabRef: 'chap4' },
        { num: 5, title: 'ผลรวมปริมาตร และน้ำหนัก (Volume Contraction)', pages: '48-52', tabRef: 'chap5' },
        { num: 6, title: 'ความหนาแน่น และความถ่วงจำเพาะ (Density & SG)', pages: '53-61', tabRef: 'chap6' },
        { num: 7, title: 'มิลลิอีคิววาเลนต์ และ มิลลิโมล (mEq & mmol)', pages: '62-75', tabRef: 'chap7' },
        { num: 8, title: 'การแสดงความเข้มข้น (Concentration Expressions)', pages: '76-159', tabRef: 'chap8' },
        { num: 9, title: 'แอลกอฮอล์ และเอทานอล (Alcohol & Ethanol)', pages: '160-169', tabRef: 'chap9' },
        { num: 10, title: 'Alligation Alternate และ Algebra', pages: '170-184', tabRef: 'chap10' },
        { num: 11, title: 'การเจือจางแบบ Aliquot (Aliquot Dilutions)', pages: '185-204', tabRef: 'chap11' },
        { num: 12, title: 'ปริมาตรผงยาในของเหลว (Powder Volume)', pages: '205-209', tabRef: 'chap12' },
        { num: 13, title: 'อัตราการไหลของยาทางหลอดเลือดดำ (IV Flow Rate)', pages: '210-217', tabRef: 'chap13' },
        { num: 14, title: 'ออสโมลาริตี และ โทนิซิตี (Osmolarity & Tonicity)', pages: '218-230', tabRef: 'chap14' },
        { num: 15, title: 'pH และ pH Buffers', pages: '231-254', tabRef: 'chap15' },
        { num: 16, title: 'อุณหภูมิ (Temperatures)', pages: '255-267', tabRef: 'chap16' },
        { num: 17, title: 'เอนโดท็อกซิน (Endotoxins)', pages: '268-275', tabRef: 'chap17' },
        { num: 18, title: 'จลนพลศาสตร์ความคงตัว & ทำนายวันหมดอายุ', pages: '276-350', tabRef: 'chap18' },
        { num: 19, title: 'อุณหภูมิเฉลี่ยจลนพลศาสตร์ (MKT)', pages: '351-396', tabRef: 'chap19' },
        { num: 20, title: 'ภาคผนวก (Appendix)', pages: '397-413', tabRef: 'chap20' },
        { num: 21, title: 'บทสรุป (Summary)', pages: '414-423', tabRef: 'chap21' },
      ];

      // --- Calculations ---
      const A = parseFloat(c2Moiety) || 0, B = parseFloat(c2MwIngredient) || 0, C = parseFloat(c2MwMoiety) || 1;
      const D = 1 - ((parseFloat(c2LossOnDrying) || 0) / 100);
      const resC2 = (C * D !== 0 ? (A * B) / (C * D) : 0).toFixed(1);

      const wtKg = c3WeightUnit === 'lb' ? (parseFloat(c3Weight) || 0) / 2.2 : (parseFloat(c3Weight) || 0);
      const resC3W = ((wtKg * (parseFloat(c3DoseRate) || 0) / (parseFloat(c3DoseFreq) || 1) * (parseFloat(c3StockMl) || 1)) / (parseFloat(c3StockMg) || 1)).toFixed(2);

      // BSA Calculation: Mosteller Formula ตามการแปลงหน่วยอิสระ
      const calcBsaVal = () => {
        if (c3BsaTarget === 'human') {
          const rawHt = parseFloat(c3HeightVal) || 0;
          const rawWt = parseFloat(c3BsaWeightVal) || 0;
          // แปลงเป็น cm และ kg เป็นมาตรฐานสากล
          const htCm = c3HeightUnit === 'in' ? rawHt * 2.54 : rawHt;
          const wtKgVal = c3BsaWeightUnit === 'lb' ? rawWt / 2.2 : rawWt;
          return Math.sqrt((htCm * wtKgVal) / 3600);
        } else {
          const g = parseFloat(c3PetWeightG) || 0;
          const factor = c3PetType === 'cat' ? 10.0 : 10.1;
          return (factor * Math.pow(g, 0.667)) / 10000;
        }
      };
      const bsa = calcBsaVal();
      const resC3Bsa = (bsa * (parseFloat(c3DosePerBsa) || 0) / (parseFloat(c3ConcPerMl) || 1)).toFixed(1);

      const resC4 = ((parseFloat(c4TotalUnits) || 0) / (parseFloat(c4PotencyUnitsPerMg) || 1)).toFixed(1);

      const wv = (parseFloat(c6PcntWw) || 0) * (parseFloat(c6Sg) || 1);
      const resC6 = ((wv / 100) * (parseFloat(c6TargetVolMl) || 0)).toFixed(2);

      const eqWeight = (parseFloat(c7Mw) || 1) / (parseFloat(c7Valence) || 1);
      const resC7 = eqWeight > 0 ? ((parseFloat(c7DoseMg) || 0) / eqWeight).toFixed(3) : '0';

      const resC8 = (((parseFloat(c8Q1) || 0) * (parseFloat(c8C1) || 0)) / (parseFloat(c8C2) || 1) - (parseFloat(c8Q1) || 0)).toFixed(1);

      const resC9 = (((parseFloat(c9TargetVol) || 0) * (parseFloat(c9TargetAlc) || 0)) / (parseFloat(c9StockAlc) || 1)).toFixed(1);

      const pH = parseFloat(c10High) || 0, pL = parseFloat(c10Low) || 0, pT = parseFloat(c10Target) || 0, pTot = parseFloat(c10TotalQty) || 0;
      const partH = pT - pL, partL = pH - pT, totPart = partH + partL;
      const resC10H = totPart > 0 ? ((partH / totPart) * pTot).toFixed(1) : '0';
      const resC10L = totPart > 0 ? ((partL / totPart) * pTot).toFixed(1) : '0';

      const lwq = ((parseFloat(c11Sensitivity) || 6) * 100) / (parseFloat(c11MaxError) || 5);
      const resC11 = lwq > 0 ? (((parseFloat(c11DrugNeeded) || 0) * (parseFloat(c11TotalMixture) || 1000)) / lwq).toFixed(1) : '0';

      const resC12 = ((parseFloat(c12TotalVol) || 0) - (parseFloat(c12WaterAdded) || 0)).toFixed(1);

      const resC13 = (((parseFloat(c13VolumeMl) || 0) * (parseFloat(c13DropFactor) || 15)) / ((parseFloat(c13TimeHours) || 1) * 60)).toFixed(0);

      const naclReq = 0.009 * (parseFloat(c14VolMl) || 0);
      const naclFromDrug = (parseFloat(c14DrugG) || 0) * (parseFloat(c14EValue) || 0);
      const resC14 = (naclReq - naclFromDrug > 0 ? naclReq - naclFromDrug : 0).toFixed(3);

      const resC15 = ((parseFloat(c15Pka) || 0) + Math.log10((parseFloat(c15Salt) || 0.1) / (parseFloat(c15Acid) || 0.1))).toFixed(2);

      const tVal = parseFloat(c16Temp) || 0;
      const resC16 = c16Scale === 'C' ? ((tVal * 9/5) + 32).toFixed(1) + ' °F' : (((tVal - 32) * 5/9)).toFixed(1) + ' °C';

                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">MKT คำนวณได้:</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC19}</span>
                          <span className="text-xs text-stone-400">°C</span>
                          <div className="text-[11px] text-stone-500 mt-4 text-center">
                            <strong>ความสำคัญ:</strong> ประเมินผลกระทบกรณีอุณหภูมิในการจัดเก็บหรือขนส่งยาเกิดความผันผวน (Temperature excursion)[cite: 1]
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 20: ภาคผนวก */}
                  {activeTab === 'chap20' && (
                    <div className="space-y-4">
                      <div className="flex items-center gap-2 text-amber-600 font-bold text-sm">
                        <Icons.FileText className="w-5 h-5" />
                        <span>บทที่ 20: ภาคผนวก 1 (Appendix 1) (น. 397–413)</span>
                      </div>
                      <h2 className="text-xl font-bold">ลอการิทึมสามัญและลอการิทึมธรรมชาติ (Common & Natural Logarithms)</h2>
                      <div className="text-sm leading-relaxed space-y-3 text-stone-600 dark:text-slate-300">
                        <p>
                          การคำนวณทางเภสัชกรรมปฏิบัติขั้นสูง เช่น ค่า pH, Henderson-Hasselbalch, จลนพลศาสตร์การเสื่อมสลายของยา (First-order kinetics) และการคำนวณ MKT จำเป็นต้องอาศัยฟังก์ชันทางคณิตศาสตร์เชิงลอการิทึม[cite: 1]:
                        </p>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                          <div className="p-4 rounded-2xl bg-white/60 dark:bg-slate-800/60 border border-stone-200 dark:border-slate-700">
                            <strong>Common Logarithm (ฐาน 10):</strong><br />
                            $\log_{10}(x)$ ใช้ในการคำนวณค่า pH และ Henderson-Hasselbalch:<br />
                            <code>pH = -log[H+]</code>[cite: 1]
                          </div>
                          <div className="p-4 rounded-2xl bg-white/60 dark:bg-slate-800/60 border border-stone-200 dark:border-slate-700">
                            <strong>Natural Logarithm (ฐาน e):</strong><br />
                            $\ln(x)$ ใช้ในสมการอัตราเร็วอันดับหนึ่ง และ Arrhenius equation:<br />
                            <code>ln(C) = ln(C0) - kt</code>[cite: 1]
                          </div>
                        </div>
                        <div className="p-3 rounded-xl bg-stone-100 dark:bg-slate-800 text-xs text-stone-500">
                          <strong>ความสำคัญ:</strong> เป็นเครื่องมือพื้นฐานทางคณิตศาสตร์ที่จำเป็นสำหรับการคำนวณจลนพลศาสตร์และเสถียรภาพของยา[cite: 1]
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 21: บทสรุป */}
                  {activeTab === 'chap21' && (
                    <div className="space-y-4">
                      <div className="flex items-center gap-2 text-amber-600 font-bold text-sm">
                        <Icons.BookOpen className="w-5 h-5" />
                        <span>บทที่ 21: บทสรุป (Summary) (น. 414–423)</span>
                      </div>
                      <h2 className="text-xl font-bold">มาตรฐานการปฏิบัติวิชาชีพเภสัชกรรม</h2>
                      <div className="text-sm leading-relaxed space-y-3 text-stone-600 dark:text-slate-300">
                        <p>
                          หนังสือ <em>"เภสัชคำนวณทางเภสัชกรรมปฏิบัติ ตาม USP-NF 〈1160〉"</em> ไม่ได้เป็นเพียงคู่มือรวบรวมสูตรคณิตศาสตร์ แต่คือ <strong>"มาตรฐานการปฏิบัติวิชาชีพ"</strong> ที่บูรณาการหลักการทางวิทยาศาสตร์เข้ากับการปฏิบัติงานจริง[cite: 1]
                        </p>
                        <p>
                          เภสัชกรและบุคลากรทางสาธารณสุขสามารถนำองค์ความรู้ในหนังสือเล่มนี้ไปประยุกต์ใช้ในการตั้งตำรับยา การจ่ายยา การควบคุมคุณภาพ และการแก้ไขปัญหาข้อจำกัดต่างๆ ในหน้างานจริง เพื่อสร้างหลักประกันว่าผลิตภัณฑ์ยาที่เตรียมขึ้นจะมีความถูกต้อง แม่นยำ มีความคงตัวที่ดี และที่สำคัญที่สุดคือ สามารถส่งมอบความปลอดภัยสูงสุดไปสู่ชีวิตของผู้ป่วยทุกราย[cite: 1]
                        </p>
                        <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-xs text-amber-900 dark:text-amber-200">
                          <strong>สรุปหัวใจสำคัญ:</strong> คำนึงถึง Active moiety, รูปแบบเกลือ, น้ำผลึกในโมเลกุลไฮเดรต, ความชื้นที่ถูกดูดซับ, ตลอดจนสภาวะการจัดเก็บยา เพื่อให้ได้ยาตามทฤษฎี 100% เสมอ[cite: 1]
                        </div>
                      </div>
                    </div>
                  )}

                </section>

                {/* Clinical Disclaimer Card */}
                <div className={`rounded-3xl p-5 sm:p-6 backdrop-blur-xl border transition-all ${
                  isDark ? 'bg-slate-900/40 border-slate-800' : 'bg-white/40 border-white/60'
                }`}>
                  <div className="flex items-start gap-3.5">
                    <Icons.ShieldAlert className="w-5 h-5 text-amber-500 shrink-0 mt-0.5" />
                    <div className="space-y-2 text-xs leading-relaxed">
                      <div className="font-bold flex items-center gap-2">
                        <span>Clinical & Compounding Practice Disclaimer</span>
                        <span className="px-2 py-0.5 rounded-full text-[10px] bg-amber-500/10 text-amber-600 dark:text-amber-400">
                          USP &lt;1160&gt; Standard
                        </span>
                      </div>
                      <p className={isDark ? 'text-slate-400' : 'text-stone-600'}>
                        โปรแกรมนี้จัดทำขึ้นเพื่อเป็นเครื่องมือช่วยคำนวณทางเภสัชกรรมตามแนวทางมาตรฐานของ <strong>USP-NF &lt;1160&gt;</strong> สำหรับการปรุงยาและการจ่ายยา ผู้ปฏิบัติงานต้องทำการตรวจสอบความถูกต้องซ้ำ (Double-checking) และประมาณค่า (Estimation) ก่อนนำไปเตรียมยาจริงให้แก่ผู้ป่วยทุกครั้ง[cite: 1]
                      </p>
                      <div className="pt-2 border-t border-stone-200/40 dark:border-slate-800 text-[11px] text-stone-400">
                        <strong>อ้างอิงตำรา:</strong> เภสัชคำนวณทางเภสัชกรรมปฏิบัติ ตาม USP-NF &lt;1160&gt; (พิมพ์ครั้งที่ 1, มิถุนายน 2569) • รศ.ดร.ภก. ภูริวัฒน์ ลี้สวัสดิ์ • คณะเภสัชศาสตร์ สถาบันวิทยาการประกอบการแห่งอโยธยา (IESA) • ISBN (e-Book): 978-616-95297-0-5[cite: 1]
                      </div>
                    </div>
                  </div>
                </div>

              </main>

              {/* Right Sidebar Table of Contents (คลิกได้ครบ 21 บท) */}
              <aside className={`lg:col-span-4 rounded-3xl p-5 backdrop-blur-2xl border transition-all shadow-xl sticky top-6 ${
                isDark ? 'bg-slate-900/60 border-slate-700/50' : 'bg-white/70 border-white/80'
              } ${isTocOpenMobile ? 'block' : 'hidden lg:block'}`}>
                
                <div className="flex items-center justify-between pb-4 border-b border-stone-200/40 dark:border-slate-800 mb-4">
                  <div className="flex items-center gap-2.5">
                    <Icons.BookOpen className="w-5 h-5 text-amber-500" />
                    <h3 className="font-bold text-base">สารบัญตำรา</h3>
                  </div>
                  <span className="text-[11px] px-2 py-0.5 rounded-full font-medium bg-stone-200/60 dark:bg-slate-800 text-stone-600 dark:text-slate-300">
                    21 บท (423 หน้า)
                  </span>
                </div>

                <div className="space-y-1.5 max-h-[620px] overflow-y-auto pr-1 no-scrollbar text-xs">
                  {tocList.map((item) => {
                    const isSelected = activeTab === item.tabRef;

                    return (
                      <div
                        key={item.num}
                        onClick={() => {
                          if (item.tabRef) {
                            setActiveTab(item.tabRef);
                            setIsTocOpenMobile(false);
                          }
                        }}
                        className={`p-2.5 rounded-2xl border transition-all flex items-center justify-between gap-2 cursor-pointer ${
                          isSelected
                            ? 'bg-amber-50 border-amber-200 text-amber-800 dark:bg-amber-500/20 dark:border-amber-500/40 dark:text-amber-300 shadow-sm font-semibold'
                            : 'bg-white/50 border-stone-100 hover:bg-stone-50 text-stone-700 dark:bg-slate-800/40 dark:border-slate-800/80 dark:hover:bg-slate-800 dark:text-slate-300'
                        }`}
                      >
                        <div className="flex items-center gap-2 min-w-0">
                          <span className="w-5 h-5 rounded-lg flex items-center justify-center text-[10px] font-mono shrink-0 bg-amber-500/10 text-amber-600 dark:text-amber-400">
                            {item.num}
                          </span>
                          <span className="truncate">{item.title}</span>
                        </div>

                        <div className="flex items-center gap-1.5 shrink-0 text-[10px] text-stone-400 font-mono">
                          <span>น.{item.pages}</span>
                          <Icons.ChevronRight className="w-3.5 h-3.5" />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </aside>

            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PharCalcWebApp />);
  </script>
</body>
</html>
