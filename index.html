      ShieldAlert: (props) => <IconWrapper {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconWrapper>,

    function PharCalcWebApp() {
      const [isDark, setIsDark] = useState(false);
      const [activeTab, setActiveTab] = useState('chap2');
      const [isTocOpenMobile, setIsTocOpenMobile] = useState(false);

      const pdfDownloadUrl = "https://drive.google.com/file/d/1pCb2TKqvuzBXCaNr_Zr0GgFeXhA_Qcvj/view?usp=sharing";

      // --- States บทที่ 2 ถึง 19 ---
      const [c2Moiety, setC2Moiety] = useState('250');
      const [c2MwIngredient, setC2MwIngredient] = useState('456');
      const [c2MwMoiety, setC2MwMoiety] = useState('360');
      const [c2LossOnDrying, setC2LossOnDrying] = useState('0.4');

      const [c3Weight, setC3Weight] = useState('36');
      const [c3WeightUnit, setC3WeightUnit] = useState('lb');
      const [c3DoseRate, setC3DoseRate] = useState('15');
      const [c3DoseFreq, setC3DoseFreq] = useState('2');
      const [c3StockMg, setC3StockMg] = useState('200');
      const [c3StockMl, setC3StockMl] = useState('5');

      const [c3Height, setC3Height] = useState('74');
      const [c3BsaWeight, setC3BsaWeight] = useState('183');
      const [c3DosePerBsa, setC3DosePerBsa] = useState('375');
      const [c3ConcPerMl, setC3ConcPerMl] = useState('10');

      const [c4TotalUnits, setC4TotalUnits] = useState('1200000');
      const [c4PotencyUnitsPerMg, setC4PotencyUnitsPerMg] = useState('1180');

      const [c6PcntWw, setC6PcntWw] = useState('37');
      const [c6Sg, setC6Sg] = useState('1.18');
      const [c6TargetVolMl, setC6TargetVolMl] = useState('75');

      const [c7Mw, setC7Mw] = useState('388.48');
      const [c7Valence, setC7Valence] = useState('1');
      const [c7DoseMg, setC7DoseMg] = useState('250');

      const [c8Q1, setC8Q1] = useState('60');
      const [c8C1, setC8C1] = useState('10');
      const [c8C2, setC8C2] = useState('5');

      const [c9StockAlc, setC9StockAlc] = useState('95');
      const [c9TargetAlc, setC9TargetAlc] = useState('70');
      const [c9TargetVol, setC9TargetVol] = useState('500');

      const [c10High, setC10High] = useState('70');
      const [c10Low, setC10Low] = useState('30');
      const [c10Target, setC10Target] = useState('50');
      const [c10TotalQty, setC10TotalQty] = useState('500');

      const [c11Sensitivity, setC11Sensitivity] = useState('6');
      const [c11MaxError, setC11MaxError] = useState('5');
      const [c11DrugNeeded, setC11DrugNeeded] = useState('20');
      const [c11TotalMixture, setC11TotalMixture] = useState('1000');

      const [c12TotalVol, setC12TotalVol] = useState('100');
      const [c12WaterAdded, setC12WaterAdded] = useState('68');

      const [c13VolumeMl, setC13VolumeMl] = useState('1000');
      const [c13TimeHours, setC13TimeHours] = useState('8');
      const [c13DropFactor, setC13DropFactor] = useState('15');

      const [c14DrugG, setC14DrugG] = useState('1');
      const [c14EValue, setC14EValue] = useState('0.23');
      const [c14VolMl, setC14VolMl] = useState('100');

      const [c15Pka, setC15Pka] = useState('4.76');
      const [c15Salt, setC15Salt] = useState('0.1');
      const [c15Acid, setC15Acid] = useState('0.1');

      const [c16Temp, setC16Temp] = useState('25');
      const [c16Scale, setC16Scale] = useState('C');

      const [c17K, setC17K] = useState('5'); // USP endotoxin threshold (EU/kg)
      const [c17M, setC17M] = useState('10'); // Max dose per kg/hr

      const [c18Order, setC18Order] = useState('1');
      const [c18K, setC18K] = useState('0.005'); // day^-1
      const [c18C0, setC18C0] = useState('100');

      const [c19Temps, setC19Temps] = useState('25, 28, 30, 26, 24, 29');

      // --- Navigation Tabs ---
      const navTabs = [
        { id: 'chap2', label: 'บทที่ 2: ปริมาณตัวยา (W=AB/CD)', icon: Icons.FlaskConical },
        { id: 'chap3w', label: 'บทที่ 3.1: ขนาดยาตามน้ำหนัก', icon: Icons.Scale },
        { id: 'chap3b', label: 'บทที่ 3.2: ขนาดยาตาม BSA', icon: Icons.Activity },
        { id: 'chap4', label: 'บทที่ 4: Potency Units', icon: Icons.Sparkles },
        { id: 'chap6', label: 'บทที่ 6: Density & SG', icon: Icons.Droplets },
        { id: 'chap7', label: 'บทที่ 7: mEq & mmol', icon: Icons.Layers },
        { id: 'chap8', label: 'บทที่ 8: เจือจาง (Q1C1=Q2C2)', icon: Icons.FlaskConical },
        { id: 'chap9', label: 'บทที่ 9: แอลกอฮอล์ & Proof', icon: Icons.Droplets },
        { id: 'chap10', label: 'บทที่ 10: Alligation Alternate', icon: Icons.Grid },
        { id: 'chap11', label: 'บทที่ 11: Aliquot Dilution', icon: Icons.Zap },
        { id: 'chap12', label: 'บทที่ 12: ปริมาตรผงยาแทนที่', icon: Icons.Layers },
        { id: 'chap13', label: 'บทที่ 13: IV Flow Rate', icon: Icons.Timer },
        { id: 'chap14', label: 'บทที่ 14: โทนิซิตี & E-Value', icon: Icons.Droplets },
        { id: 'chap15', label: 'บทที่ 15: pH บัฟเฟอร์ (H-H)', icon: Icons.Gauge },
        { id: 'chap16', label: 'บทที่ 16: แปลงอุณหภูมิ', icon: Icons.Thermometer },
        { id: 'chap17', label: 'บทที่ 17: เอนโดท็อกซิน (K/M)', icon: Icons.ShieldAlert },
        { id: 'chap18', label: 'บทที่ 18: เสถียรภาพ & t90', icon: Icons.Clock },
        { id: 'chap19', label: 'บทที่ 19: อุณหภูมิเฉลี่ยจลน์ (MKT)', icon: Icons.Thermometer },
      ];

      const tocList = [
        { num: 1, title: 'บทนำ (Introduction)', pages: '1-5', tabRef: null },
        { num: 2, title: 'ปริมาณสารออกฤทธิ์ (Active Ingredients)', pages: '6-28', tabRef: 'chap2' },
        { num: 3, title: 'การให้ยาตามน้ำหนัก และ พื้นที่ผิวกาย', pages: '29-43', tabRef: 'chap3w' },
        { num: 4, title: 'หน่วยความแรงทางชีวภาพ (Potency Units)', pages: '44-47', tabRef: 'chap4' },
        { num: 5, title: 'ผลรวมปริมาตร และน้ำหนัก (Volume Contraction)', pages: '48-52', tabRef: 'chap9' },
        { num: 6, title: 'ความหนาแน่น และความถ่วงจำเพาะ (Density & SG)', pages: '53-61', tabRef: 'chap6' },
        { num: 7, title: 'มิลลิอีคิววาเลนต์ และ มิลลิโมล (mEq & mmol)', pages: '62-75', tabRef: 'chap7' },
        { num: 8, title: 'การแสดงความเข้มข้น (Concentration Expressions)', pages: '76-159', tabRef: 'chap8' },
        { num: 9, title: 'แอลกอฮอล์ และเอทานอล (Alcohol and Ethanol)', pages: '160-169', tabRef: 'chap9' },
        { num: 10, title: 'Alligation Alternate และ Algebra', pages: '170-184', tabRef: 'chap10' },
        { num: 11, title: 'การเจือจางแบบ Aliquot (Aliquot Dilutions)', pages: '185-204', tabRef: 'chap11' },
        { num: 12, title: 'ปริมาตรผงยาในของเหลว (Powder Volume)', pages: '205-209', tabRef: 'chap12' },
        { num: 13, title: 'อัตราการไหลของยาทางหลอดเลือดดำ (IV Flow Rate)', pages: '210-217', tabRef: 'chap13' },
        { num: 14, title: 'ออสโมลาริตี และ โทนิซิตี (Osmolarity & Tonicity)', pages: '218-230', tabRef: 'chap14' },
        { num: 15, title: 'pH และ pH Buffers', pages: '231-254', tabRef: 'chap15' },
        { num: 16, title: 'อุณหภูมิ (Temperatures)', pages: '255-267', tabRef: 'chap16' },
        { num: 17, title: 'เอนโดท็อกซิน (Endotoxins)', pages: '268-275', tabRef: 'chap17' },
        { num: 18, title: 'จลนพลศาสตร์ความคงตัว & ทำนายวันหมดอายุ', pages: '276-350', tabRef: 'chap18' },
        { num: 19, title: 'อุณหภูมิเฉลี่ยจลนพลศาสตร์ (MKT)', pages: '351-396', tabRef: 'chap19' },
        { num: 20, title: 'ภาคผนวก (Appendix)', pages: '397-413', tabRef: null },
        { num: 21, title: 'บทสรุป (Summary)', pages: '414-423', tabRef: null },
      ];

      // --- Calculations ---
      const A = parseFloat(c2Moiety) || 0, B = parseFloat(c2MwIngredient) || 0, C = parseFloat(c2MwMoiety) || 1;
      const D = 1 - ((parseFloat(c2LossOnDrying) || 0) / 100);
      const resC2 = (C * D !== 0 ? (A * B) / (C * D) : 0).toFixed(1);

      const wtKg = c3WeightUnit === 'lb' ? (parseFloat(c3Weight) || 0) / 2.2 : (parseFloat(c3Weight) || 0);
      const resC3W = ((wtKg * (parseFloat(c3DoseRate) || 0) / (parseFloat(c3DoseFreq) || 1) * (parseFloat(c3StockMl) || 1)) / (parseFloat(c3StockMg) || 1)).toFixed(2);

      const bsa = Math.sqrt(((parseFloat(c3Height) || 0) * (parseFloat(c3BsaWeight) || 0)) / 3131);
      const resC3Bsa = (bsa * (parseFloat(c3DosePerBsa) || 0) / (parseFloat(c3ConcPerMl) || 1)).toFixed(1);

      const resC4 = ((parseFloat(c4TotalUnits) || 0) / (parseFloat(c4PotencyUnitsPerMg) || 1)).toFixed(1);

      const wv = (parseFloat(c6PcntWw) || 0) * (parseFloat(c6Sg) || 1);
      const resC6 = ((wv / 100) * (parseFloat(c6TargetVolMl) || 0)).toFixed(2);

      const eqWeight = (parseFloat(c7Mw) || 1) / (parseFloat(c7Valence) || 1);
      const resC7 = eqWeight > 0 ? ((parseFloat(c7DoseMg) || 0) / eqWeight).toFixed(3) : '0';

      const resC8 = (((parseFloat(c8Q1) || 0) * (parseFloat(c8C1) || 0)) / (parseFloat(c8C2) || 1) - (parseFloat(c8Q1) || 0)).toFixed(1);

      const resC9 = (((parseFloat(c9TargetVol) || 0) * (parseFloat(c9TargetAlc) || 0)) / (parseFloat(c9StockAlc) || 1)).toFixed(1);

      const pH = parseFloat(c10High) || 0, pL = parseFloat(c10Low) || 0, pT = parseFloat(c10Target) || 0, pTot = parseFloat(c10TotalQty) || 0;
      const partH = pT - pL, partL = pH - pT, totPart = partH + partL;
      const resC10H = totPart > 0 ? ((partH / totPart) * pTot).toFixed(1) : '0';
      const resC10L = totPart > 0 ? ((partL / totPart) * pTot).toFixed(1) : '0';

      const lwq = ((parseFloat(c11Sensitivity) || 6) * 100) / (parseFloat(c11MaxError) || 5);
      const resC11 = lwq > 0 ? (((parseFloat(c11DrugNeeded) || 0) * (parseFloat(c11TotalMixture) || 1000)) / lwq).toFixed(1) : '0';

      const resC12 = ((parseFloat(c12TotalVol) || 0) - (parseFloat(c12WaterAdded) || 0)).toFixed(1);

      const resC13 = (((parseFloat(c13VolumeMl) || 0) * (parseFloat(c13DropFactor) || 15)) / ((parseFloat(c13TimeHours) || 1) * 60)).toFixed(0);

      const naclReq = 0.009 * (parseFloat(c14VolMl) || 0);
      const naclFromDrug = (parseFloat(c14DrugG) || 0) * (parseFloat(c14EValue) || 0);
      const resC14 = (naclReq - naclFromDrug > 0 ? naclReq - naclFromDrug : 0).toFixed(3);

      const resC15 = ((parseFloat(c15Pka) || 0) + Math.log10((parseFloat(c15Salt) || 0.1) / (parseFloat(c15Acid) || 0.1))).toFixed(2);

      const tVal = parseFloat(c16Temp) || 0;
      const resC16 = c16Scale === 'C' ? ((tVal * 9/5) + 32).toFixed(1) + ' °F' : (((tVal - 32) * 5/9)).toFixed(1) + ' °C';

      const resC17 = ((parseFloat(c17K) || 5) / (parseFloat(c17M) || 1)).toFixed(2);

      const kVal = parseFloat(c18K) || 0.001;
      const resC18_t90 = c18Order === '0' ? ((0.1 * (parseFloat(c18C0) || 100)) / kVal).toFixed(1) : (0.105 / kVal).toFixed(1);

      const calcMkt = () => {
        try {
          const arr = c19Temps.split(',').map(s => parseFloat(s.trim()) + 273.15).filter(n => !isNaN(n));
          if (arr.length === 0) return '0';
          const dH_R = 83.144 / 0.0083144; // standard 83.144 kJ/mol
          const sumExp = arr.reduce((acc, t) => acc + Math.exp(-dH_R / t), 0);
          const mktK = -dH_R / Math.log(sumExp / arr.length);
          return (mktK - 273.15).toFixed(2);
        } catch(e) { return '0'; }
      };
      const resC19 = calcMkt();

      return (
        <div className={`min-h-screen transition-colors duration-300 ${
          isDark ? 'bg-[#181a1f] text-slate-100' : 'bg-gradient-to-br from-[#f1ede6] via-[#f7f5f0] to-[#e8e2d8] text-slate-800'
        } font-sans pb-10`}>
          
          <div className="max-w-[1720px] mx-auto p-3 sm:p-5 md:p-7 flex flex-col gap-5">

            {/* Header */}
            <header className={`rounded-3xl p-4 sm:p-6 backdrop-blur-2xl border transition-all duration-300 shadow-xl flex flex-wrap items-center justify-between gap-4 ${
              isDark ? 'bg-slate-900/60 border-slate-700/50 shadow-black/20' : 'bg-white/70 border-white/80 shadow-stone-200/50'
            }`}>
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white shadow-lg shadow-orange-500/20">
                  <Icons.Calculator className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-bold tracking-tight">เภสัชคำนวณทางเภสัชกรรมปฏิบัติ</h1>
                    <span className="text-xs px-2.5 py-0.5 rounded-full font-medium bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
                      USP-NF &lt;1160&gt; ครบ 21 บท
                    </span>
                  </div>
                  <p className={`text-xs sm:text-sm mt-0.5 ${isDark ? 'text-slate-400' : 'text-stone-500'}`}>
                    อ้างอิง: รศ.ดร.ภก. ภูริวัฒน์ ลี้สวัสดิ์ • สถาบันวิทยาการประกอบการแห่งอโยธยา (IESA)
                  </p>

                        <div className="space-y-3">
                          <div><label className="text-xs font-semibold">ปริมาตรตำรับสุดท้ายที่ได้ (mL):</label><input type="number" value={c12TotalVol} onChange={e => setC12TotalVol(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          <div><label className="text-xs font-semibold">ปริมาตรน้ำที่เติมเข้าไปจริง (mL):</label><input type="number" value={c12WaterAdded} onChange={e => setC12WaterAdded(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                        </div>
                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">ปริมาตรการแทนที่ของผงยา:</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC12}</span>
                          <span className="text-xs text-stone-400">mL (Powder Volume)</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 13 */}
                  {activeTab === 'chap13' && (
                    <div>
                      <h2 className="text-lg font-bold mb-4">บทที่ 13: อัตราการให้ยาทางหลอดเลือดดำ (IV Flow Rate)</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-3">
                          <div><label className="text-xs font-semibold">ปริมาตรสารละลาย (mL):</label><input type="number" value={c13VolumeMl} onChange={e => setC13VolumeMl(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          <div><label className="text-xs font-semibold">เวลาบริหารยา (ชม.):</label><input type="number" value={c13TimeHours} onChange={e => setC13TimeHours(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          <div><label className="text-xs font-semibold">Drop Factor (gtt/mL):</label><input type="number" value={c13DropFactor} onChange={e => setC13DropFactor(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                        </div>
                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">อัตราหยดทางสายน้ำเกลือ:</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC13}</span>
                          <span className="text-xs text-stone-400">หยดต่อนาที (gtt/min)</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 14 */}
                  {activeTab === 'chap14' && (
                    <div>
                      <h2 className="text-lg font-bold mb-4">บทที่ 14: ออสโมลาริตี โทนิซิตี และค่า E-Value</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-3">
                          <div><label className="text-xs font-semibold">น้ำหนักตัวยาในสูตร (กรัม):</label><input type="number" value={c14DrugG} onChange={e => setC14DrugG(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          <div><label className="text-xs font-semibold">ค่า E-Value เทียบเท่า NaCl:</label><input type="number" step="0.01" value={c14EValue} onChange={e => setC14EValue(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          <div><label className="text-xs font-semibold">ปริมาตรตำรับ (mL):</label><input type="number" value={c14VolMl} onChange={e => setC14VolMl(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                        </div>
                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">น้ำหนัก NaCl ที่ต้องเติมเพิ่ม:</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC14}</span>
                          <span className="text-xs text-stone-400">กรัม เพื่อให้เป็น Isotonic Solution</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 15 */}
                  {activeTab === 'chap15' && (
                    <div>
                      <h2 className="text-lg font-bold mb-4">บทที่ 15: บัฟเฟอร์ Henderson-Hasselbalch</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-3">
                          <div><label className="text-xs font-semibold">pKa ของกรด:</label><input type="number" step="0.01" value={c15Pka} onChange={e => setC15Pka(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          <div><label className="text-xs font-semibold">ความเข้มข้นเกลือ [Salt] (M):</label><input type="number" step="0.01" value={c15Salt} onChange={e => setC15Salt(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          <div><label className="text-xs font-semibold">ความเข้มข้นกรด [Acid] (M):</label><input type="number" step="0.01" value={c15Acid} onChange={e => setC15Acid(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                        </div>
                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">ค่า pH ของสารละลายบัฟเฟอร์:</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC15}</span>
                          <span className="text-xs text-stone-400">pH = pKa + log([Salt]/[Acid])</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 16 */}
                  {activeTab === 'chap16' && (
                    <div>
                      <h2 className="text-lg font-bold mb-4">บทที่ 16: การแปลงหน่วยอุณหภูมิ (°C / °F / K)</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-3">
                          <div className="flex gap-2">
                            <input type="number" value={c16Temp} onChange={e => setC16Temp(e.target.value)} className="flex-1 px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" />
                            <select value={c16Scale} onChange={e => setC16Scale(e.target.value)} className="px-3 py-2 rounded-xl border text-xs dark:bg-slate-800"><option value="C">°C</option><option value="F">°F</option></select>
                          </div>
                        </div>
                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">อุณหภูมิที่แปลงได้:</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC16}</span>
                          <span className="text-xs text-stone-400">{(tVal + (c16Scale === 'C' ? 273.15 : 0)).toFixed(1)} K</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 17 */}
                  {activeTab === 'chap17' && (
                    <div>
                      <h2 className="text-lg font-bold mb-4">บทที่ 17: ขีดจำกัดเอนโดท็อกซิน (Endotoxin Limit = K / M)</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-3">
                          <div><label className="text-xs font-semibold">K: Threshold Pyrogenic Dose (EU/kg):</label><input type="number" value={c17K} onChange={e => setC17K(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          <div><label className="text-xs font-semibold">M: ขนาดยาสูงสุดต่อชั่วโมง (mg/kg/hr หรือ units/kg/hr):</label><input type="number" value={c17M} onChange={e => setC17M(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                        </div>
                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">Endotoxin Limit:</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC17}</span>
                          <span className="text-xs text-stone-400">EU / หน่วยขนาดยา</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 18 */}
                  {activeTab === 'chap18' && (
                    <div>
                      <h2 className="text-lg font-bold mb-4">บทที่ 18: เสถียรภาพยาและวันหมดอายุ (t90)</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-3">
                          <div>
                            <label className="text-xs font-semibold">อันดับปฏิกิริยา (Reaction Order):</label>
                            <select value={c18Order} onChange={e => setC18Order(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-xs dark:bg-slate-800">
                              <option value="1">First-Order (ln C = ln C0 - kt)</option>
                              <option value="0">Zero-Order (C = C0 - kt)</option>
                            </select>
                          </div>
                          <div><label className="text-xs font-semibold">ค่าคงที่อัตราเร็ว k (day⁻¹):</label><input type="number" step="0.0001" value={c18K} onChange={e => setC18K(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>
                          {c18Order === '0' && <div><label className="text-xs font-semibold">ความเข้มข้นตั้งต้น C0:</label><input type="number" value={c18C0} onChange={e => setC18C0(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" /></div>}
                        </div>
                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">อายุยาคงเหลือ 90% (t90):</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC18_t90}</span>
                          <span className="text-xs text-stone-400">วัน (Shelf-life)</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* บทที่ 19 */}
                  {activeTab === 'chap19' && (
                    <div>
                      <h2 className="text-lg font-bold mb-4">บทที่ 19: อุณหภูมิเฉลี่ยจลนพลศาสตร์ (Mean Kinetic Temperature - MKT)</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="space-y-3">
                          <div>
                            <label className="text-xs font-semibold">ชุดอุณหภูมิ (°C คั่นด้วยจุลภาค):</label>
                            <input type="text" value={c19Temps} onChange={e => setC19Temps(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm dark:bg-slate-800" />
                          </div>
                          <p className="text-[11px] text-stone-400">คำนวณตามสมการ USP Arrhenius Activation Energy (ΔH = 83.144 kJ/mol)</p>
                        </div>
                        <div className="p-6 rounded-2xl border flex flex-col justify-center items-center bg-amber-500/5 dark:bg-slate-800/40">
                          <span className="text-xs text-stone-500">MKT คำนวณได้:</span>
                          <span className="text-5xl font-extrabold text-amber-600 my-2">{resC19}</span>
                          <span className="text-xs text-stone-400">°C</span>
                        </div>
                      </div>
                    </div>
                  )}

                </section>

                {/* Disclaimer */}
                <div className={`rounded-3xl p-5 sm:p-6 backdrop-blur-xl border transition-all ${
                  isDark ? 'bg-slate-900/40 border-slate-800' : 'bg-white/40 border-white/60'
                }`}>
                  <div className="flex items-start gap-3.5">
                    <Icons.ShieldAlert className="w-5 h-5 text-amber-500 shrink-0 mt-0.5" />
                    <div className="space-y-2 text-xs leading-relaxed">
                      <div className="font-bold flex items-center gap-2">
                        <span>Clinical & Compounding Practice Disclaimer</span>
                        <span className="px-2 py-0.5 rounded-full text-[10px] bg-amber-500/10 text-amber-600 dark:text-amber-400">
                          USP &lt;1160&gt; Standard
                        </span>
                      </div>
                      <p className={isDark ? 'text-slate-400' : 'text-stone-600'}>
                        โปรแกรมนี้จัดทำขึ้นเพื่อเป็นเครื่องมือช่วยคำนวณทางเภสัชกรรมตามแนวทางมาตรฐานของ <strong>USP-NF &lt;1160&gt;</strong> สำหรับการปรุงยาและการจ่ายยา ผู้ปฏิบัติงานต้องทำการตรวจสอบความถูกต้องซ้ำ (Double-checking) และประมาณค่า (Estimation) ก่อนนำไปเตรียมยาจริงให้แก่ผู้ป่วยทุกครั้ง
                      </p>
                    </div>
                  </div>
                </div>

              </main>

              {/* Right Sidebar TOC */}
              <aside className={`lg:col-span-4 rounded-3xl p-5 backdrop-blur-2xl border transition-all shadow-xl sticky top-6 ${
                isDark ? 'bg-slate-900/60 border-slate-700/50' : 'bg-white/70 border-white/80'
              } ${isTocOpenMobile ? 'block' : 'hidden lg:block'}`}>
                
                <div className="flex items-center justify-between pb-4 border-b border-stone-200/40 dark:border-slate-800 mb-4">
                  <div className="flex items-center gap-2.5">
                    <Icons.BookOpen className="w-5 h-5 text-amber-500" />
                    <h3 className="font-bold text-base">สารบัญตำรา</h3>
                  </div>
                  <span className="text-[11px] px-2 py-0.5 rounded-full font-medium bg-stone-200/60 dark:bg-slate-800 text-stone-600 dark:text-slate-300">
                    21 บท (423 หน้า)
                  </span>
                </div>

                <div className="space-y-1.5 max-h-[620px] overflow-y-auto pr-1 no-scrollbar text-xs">
                  {tocList.map((item) => {
                    const isSupported = item.tabRef !== null;
                    const isSelected = activeTab === item.tabRef;

                    return (
                      <div
                        key={item.num}
                        onClick={() => {
                          if (item.tabRef) {
                            setActiveTab(item.tabRef);
                            setIsTocOpenMobile(false);
                          }
                        }}
                        className={`p-2.5 rounded-2xl border transition-all flex items-center justify-between gap-2 ${
                          isSupported
                            ? isSelected
                              ? 'bg-amber-50 border-amber-200 text-amber-800 dark:bg-amber-500/20 dark:border-amber-500/40 dark:text-amber-300 shadow-sm font-semibold'
                              : 'bg-white/50 border-stone-100 hover:bg-stone-50 text-stone-700 dark:bg-slate-800/40 dark:border-slate-800/80 dark:hover:bg-slate-800 dark:text-slate-300 cursor-pointer'
                            : 'opacity-50'
                        }`}
                      >
                        <div className="flex items-center gap-2 min-w-0">
                          <span className="w-5 h-5 rounded-lg flex items-center justify-center text-[10px] font-mono shrink-0 bg-amber-500/10 text-amber-600 dark:text-amber-400">
                            {item.num}
                          </span>
                          <span className="truncate">{item.title}</span>
                        </div>

                        <div className="flex items-center gap-1.5 shrink-0 text-[10px] text-stone-400 font-mono">
                          <span>น.{item.pages}</span>
                          {isSupported && <Icons.ChevronRight className="w-3.5 h-3.5" />}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </aside>

            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PharCalcWebApp />);
  </script>
</body>
</html>
