  <script type="text/babel">
    const { useState, useEffect } = React;

    // Service Worker Registration สำหรับ PWA
    if ('serviceWorker' in navigator) {

          .then(reg => console.log('PWA Service Worker registered:', reg.scope))

    const IconWrapper = ({ children, className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

    const Icons = {
      Sun: (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconWrapper>,
      Moon: (props) => <IconWrapper {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconWrapper>,
      Calculator: (props) => <IconWrapper {...props}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconWrapper>,
      Download: (props) => <IconWrapper {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconWrapper>,
      ExternalLink: (props) => <IconWrapper {...props}><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></IconWrapper>,
      FlaskConical: (props) => <IconWrapper {...props}><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></IconWrapper>,
      Scale: (props) => <IconWrapper {...props}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></IconWrapper>,
      Activity: (props) => <IconWrapper {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconWrapper>,
      Sparkles: (props) => <IconWrapper {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></IconWrapper>,
      Droplets: (props) => <IconWrapper {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></IconWrapper>,
      Layers: (props) => <IconWrapper {...props}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></IconWrapper>,
      Stethoscope: (props) => <IconWrapper {...props}><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></IconWrapper>,
      BookOpen: (props) => <IconWrapper {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconWrapper>,
      Bookmark: (props) => <IconWrapper {...props}><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></IconWrapper>,
      AlertTriangle: (props) => <IconWrapper {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></IconWrapper>,
      ShieldCheck: (props) => <IconWrapper {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>,
      ChevronRight: (props) => <IconWrapper {...props}><polyline points="9 18 15 12 9 6"/></IconWrapper>,
      Menu: (props) => <IconWrapper {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconWrapper>,
      X: (props) => <IconWrapper {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconWrapper>,
      Grid: (props) => <IconWrapper {...props}><rect width="18" height="18" x="3" y="3" rx="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="3" x2="21" y1="15" y2="15"/><line x1="9" x2="9" y1="3" y2="21"/><line x1="15" x2="15" y1="3" y2="21"/></IconWrapper>,
      Timer: (props) => <IconWrapper {...props}><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></IconWrapper>,
      Zap: (props) => <IconWrapper {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>
    };

    function PharCalcWebApp() {
      const [isDark, setIsDark] = useState(false);
      const [activeTab, setActiveTab] = useState('chap2');
      const [isTocOpenMobile, setIsTocOpenMobile] = useState(false);

      const pdfDownloadUrl = "https://drive.google.com/file/d/1pCb2TKqvuzBXCaNr_Zr0GgFeXhA_Qcvj/view?usp=sharing";

      // --- States บทคำนวณ ---
      // บทที่ 2
      const [c2Moiety, setC2Moiety] = useState('250');
      const [c2MwIngredient, setC2MwIngredient] = useState('456');
      const [c2MwMoiety, setC2MwMoiety] = useState('360');
      const [c2LossOnDrying, setC2LossOnDrying] = useState('0.4');
      const [c2UseMoisture, setC2UseMoisture] = useState(true);

      // บทที่ 3.1
      const [c3Weight, setC3Weight] = useState('36');
      const [c3WeightUnit, setC3WeightUnit] = useState('lb');
      const [c3DoseRate, setC3DoseRate] = useState('15');
      const [c3DoseFreq, setC3DoseFreq] = useState('2');
      const [c3StockMg, setC3StockMg] = useState('200');
      const [c3StockMl, setC3StockMl] = useState('5');

      // บทที่ 3.2
      const [c3BsaMode, setC3BsaMode] = useState('human');
      const [c3BsaUnit, setC3BsaUnit] = useState('imperial');
      const [c3Height, setC3Height] = useState('74');
      const [c3BsaWeight, setC3BsaWeight] = useState('183');
      const [c3PetWeightG, setC3PetWeightG] = useState('5800');
      const [c3PetType, setC3PetType] = useState('cat');
      const [c3DosePerBsa, setC3DosePerBsa] = useState('375');
      const [c3ConcPerMl, setC3ConcPerMl] = useState('10');

      // บทที่ 4
      const [c4TotalUnits, setC4TotalUnits] = useState('1200000');
      const [c4PotencyUnitsPerMg, setC4PotencyUnitsPerMg] = useState('1180');

      // บทที่ 6
      const [c6PcntWw, setC6PcntWw] = useState('37');
      const [c6Sg, setC6Sg] = useState('1.18');
      const [c6TargetVolMl, setC6TargetVolMl] = useState('75');

      // บทที่ 7
      const [c7Mw, setC7Mw] = useState('388.48');
      const [c7Valence, setC7Valence] = useState('1');
      const [c7DoseMg, setC7DoseMg] = useState('250');

      // บทที่ 8
      const [c8Q1, setC8Q1] = useState('60');
      const [c8C1, setC8C1] = useState('10');
      const [c8C2, setC8C2] = useState('5');

      // บทที่ 10 Alligation Alternate
      const [c10High, setC10High] = useState('70');
      const [c10Low, setC10Low] = useState('30');
      const [c10Target, setC10Target] = useState('50');
      const [c10TotalQty, setC10TotalQty] = useState('500');

      // บทที่ 11 Aliquot Method
      const [c11Sensitivity, setC11Sensitivity] = useState('6'); // SR (mg)
      const [c11MaxError, setC11MaxError] = useState('5'); // Error ไม่เกิน 5%
      const [c11DrugNeeded, setC11DrugNeeded] = useState('20'); // ตัวยาที่ต้องการชั่ง (mg)
      const [c11DiluentWeighed, setC11DiluentWeighed] = useState('1000'); // น้ำหนักตัวเจือจางที่ผสม

      // บทที่ 13 IV Flow Rate
      const [c13VolumeMl, setC13VolumeMl] = useState('1000');
      const [c13TimeHours, setC13TimeHours] = useState('8');
      const [c13DropFactor, setC13DropFactor] = useState('15'); // gtt/mL

      // บทที่ 14 Tonicity & E-Value
      const [c14DrugWeightG, setC14DrugWeightG] = useState('1'); // กรัม
      const [c14EValue, setC14EValue] = useState('0.23'); // ค่า E-value เทียบเท่า NaCl
      const [c14FinalVolumeMl, setC14FinalVolumeMl] = useState('100'); // ปริมาตรตำรับ (mL)

      const navTabs = [
        { id: 'chap2', label: 'บทที่ 2: ปริมาณตัวยา (W=AB/CD)', icon: Icons.FlaskConical },
        { id: 'chap3w', label: 'บทที่ 3.1: ขนาดยาตามน้ำหนัก', icon: Icons.Scale },
        { id: 'chap3b', label: 'บทที่ 3.2: ขนาดยาตาม BSA', icon: Icons.Activity },
        { id: 'chap4', label: 'บทที่ 4: Potency Units', icon: Icons.Sparkles },
        { id: 'chap6', label: 'บทที่ 6: Density & SG', icon: Icons.Droplets },
        { id: 'chap7', label: 'บทที่ 7: mEq & mmol', icon: Icons.Layers },
        { id: 'chap8', label: 'บทที่ 8: เจือจาง (Q1C1=Q2C2)', icon: Icons.Stethoscope },
        { id: 'chap10', label: 'บทที่ 10: Alligation Alternate', icon: Icons.Grid },
        { id: 'chap11', label: 'บทที่ 11: Aliquot Dilution', icon: Icons.Zap },
        { id: 'chap13', label: 'บทที่ 13: IV Flow Rate', icon: Icons.Timer },
        { id: 'chap14', label: 'บทที่ 14: Tonicity (E-Value)', icon: Icons.Droplets },
      ];

      const tocList = [
        { num: 1, title: 'บทนำ (Introduction)', pages: '1-5', tabRef: null },
        { num: 2, title: 'ปริมาณสารออกฤทธิ์ (Active Ingredients)', pages: '6-28', tabRef: 'chap2' },
        { num: 3, title: 'การให้ยาตามน้ำหนัก และ พื้นที่ผิวกาย', pages: '29-43', tabRef: 'chap3w' },
        { num: 4, title: 'หน่วยความแรงทางชีวภาพ (Biological Potency Units)', pages: '44-47', tabRef: 'chap4' },
        { num: 5, title: 'ผลรวมปริมาตร และน้ำหนัก (Volume & Weight Sums)', pages: '48-52', tabRef: null },
        { num: 6, title: 'ความหนาแน่น และความถ่วงจำเพาะ (Density & SG)', pages: '53-61', tabRef: 'chap6' },
        { num: 7, title: 'มิลลิอีคิววาเลนต์ และ มิลลิโมล (mEq & mmol)', pages: '62-75', tabRef: 'chap7' },
        { num: 8, title: 'การแสดงความเข้มข้น (Concentration Expressions)', pages: '76-159', tabRef: 'chap8' },
        { num: 9, title: 'แอลกอฮอล์ และเอทานอล (Alcohol and Ethanol)', pages: '160-169', tabRef: null },
        { num: 10, title: 'Alligation Alternate และ Algebra', pages: '170-184', tabRef: 'chap10' },
        { num: 11, title: 'การเจือจางแบบ Aliquot (Aliquot Dilutions)', pages: '185-204', tabRef: 'chap11' },
        { num: 12, title: 'ปริมาตรผงยาในของเหลว (Powder Volume)', pages: '205-209', tabRef: null },
        { num: 13, title: 'อัตราการไหลของยาทางหลอดเลือดดำ (IV Flow Rate)', pages: '210-217', tabRef: 'chap13' },
        { num: 14, title: 'ออสโมลาริตี และ โทนิซิตี (Osmolarity & Tonicity)', pages: '218-230', tabRef: 'chap14' },
        { num: 15, title: 'pH และ pH Buffers', pages: '231-254', tabRef: null },
        { num: 16, title: 'อุณหภูมิ (Temperatures)', pages: '255-267', tabRef: null },
        { num: 17, title: 'เอนโดท็อกซิน (Endotoxins)', pages: '268-275', tabRef: null },
        { num: 18, title: 'จลนพลศาสตร์ความคงตัว & ทำนายวันหมดอายุ', pages: '276-350', tabRef: null },
        { num: 19, title: 'อุณหภูมิเฉลี่ยจลนพลศาสตร์ (MKT)', pages: '351-396', tabRef: null },
        { num: 20, title: 'ภาคผนวก (Appendix)', pages: '397-413', tabRef: null },
        { num: 21, title: 'บทสรุป (Summary)', pages: '414-423', tabRef: null },
      ];

      // --- ฟังก์ชันการคำนวณทั้งหมด ---
      const calcC2 = () => {
        const A = parseFloat(c2Moiety) || 0;
        const B = parseFloat(c2MwIngredient) || 0;
        const C = parseFloat(c2MwMoiety) || 1;
        const lod = c2UseMoisture ? (parseFloat(c2LossOnDrying) || 0) : 0;
        const D = 1 - (lod / 100);
        const W = (C * D) !== 0 ? (A * B) / (C * D) : 0;
        const est = (C !== 0) ? (A * B) / C : 0;
        return { W: W.toFixed(1), D: D.toFixed(4), est: est.toFixed(1) };
      };

      const calcC3W = () => {
        const rawWt = parseFloat(c3Weight) || 0;
        const wtKg = c3WeightUnit === 'lb' ? rawWt / 2.2 : rawWt;
        const rate = parseFloat(c3DoseRate) || 0;
        const freq = parseFloat(c3DoseFreq) || 1;
        const stockMg = parseFloat(c3StockMg) || 1;
        const stockMl = parseFloat(c3StockMl) || 1;
        const totalMgPerDay = wtKg * rate;
        const mgPerDose = freq > 0 ? totalMgPerDay / freq : 0;
        const mlPerDose = stockMg > 0 ? (mgPerDose * stockMl) / stockMg : 0;
        return { wtKg: wtKg.toFixed(2), totalMgPerDay: totalMgPerDay.toFixed(1), mgPerDose: mgPerDose.toFixed(1), mlPerDose: mlPerDose.toFixed(2) };
      };

      const calcC3Bsa = () => {
        let bsa = 0;
        if (c3BsaMode === 'human') {
          const ht = parseFloat(c3Height) || 0;
          const wt = parseFloat(c3BsaWeight) || 0;
          bsa = c3BsaUnit === 'imperial' ? Math.sqrt((ht * wt) / 3131) : Math.sqrt((ht * wt) / 3600);
        } else {
          const g = parseFloat(c3PetWeightG) || 0;
          const factor = c3PetType === 'cat' ? 10.0 : 10.1;
          bsa = (factor * Math.pow(g, 0.667)) / 10000;
        }
        const doseRate = parseFloat(c3DosePerBsa) || 0;
        const conc = parseFloat(c3ConcPerMl) || 1;
        const totalDoseMg = bsa * doseRate;
        const volumeMl = conc > 0 ? totalDoseMg / conc : 0;
        return { bsa: bsa.toFixed(3), totalDoseMg: totalDoseMg.toFixed(1), volumeMl: volumeMl.toFixed(1) };
      };

      const calcC4 = () => {
        const u = parseFloat(c4TotalUnits) || 0;
        const p = parseFloat(c4PotencyUnitsPerMg) || 1;
        return (p > 0 ? u / p : 0).toFixed(1);
      };

      const calcC6 = () => {
        const ww = parseFloat(c6PcntWw) || 0;
        const sg = parseFloat(c6Sg) || 1;
        const vol = parseFloat(c6TargetVolMl) || 0;
        const wv = ww * sg;
        const pureGram = (wv / 100) * vol;
        return { wv: wv.toFixed(2), pureGram: pureGram.toFixed(2) };
      };

      const calcC7 = () => {
        const mw = parseFloat(c7Mw) || 1;
        const val = parseFloat(c7Valence) || 1;
        const doseMg = parseFloat(c7DoseMg) || 0;
        const eqWeight = mw / val;
        const mEqInDose = eqWeight > 0 ? doseMg / eqWeight : 0;
        const mmolInDose = mw > 0 ? doseMg / mw : 0;
        return { mEqWeightMg: eqWeight.toFixed(2), mEqInDose: mEqInDose.toFixed(3), mmolInDose: mmolInDose.toFixed(3) };
      };

      const calcC8 = () => {
        const q1 = parseFloat(c8Q1) || 0;
        const c1 = parseFloat(c8C1) || 0;
        const c2 = parseFloat(c8C2) || 1;
        const q2 = c2 > 0 ? (q1 * c1) / c2 : 0;
        const diluent = q2 - q1;
        return { q2: q2.toFixed(1), diluent: (diluent > 0 ? diluent : 0).toFixed(1) };
      };

      const calcC10 = () => {
        const h = parseFloat(c10High) || 0;
        const l = parseFloat(c10Low) || 0;
        const t = parseFloat(c10Target) || 0;
        const tot = parseFloat(c10TotalQty) || 0;
        const valid = h > t && t > l;
        const partH = valid ? t - l : 0;
        const partL = valid ? h - t : 0;
        const totalParts = partH + partL;
        const qtyH = totalParts > 0 ? (partH / totalParts) * tot : 0;
        const qtyL = totalParts > 0 ? (partL / totalParts) * tot : 0;
        return { valid, partH, partL, totalParts, qtyH: qtyH.toFixed(1), qtyL: qtyL.toFixed(1) };
      };

      const calcC11 = () => {
        const sr = parseFloat(c11Sensitivity) || 6;
        const err = parseFloat(c11MaxError) || 5;
        const lwq = (sr * 100) / err; // Least Weighable Quantity (LWQ)
        const drugTarget = parseFloat(c11DrugNeeded) || 0;
        const drugWeighed = lwq; // ชั่งยาอย่างน้อยเท่ากับ LWQ
        const totalMixture = parseFloat(c11DiluentWeighed) || 1000;
        const aliquotWeight = drugWeighed > 0 ? (drugTarget * totalMixture) / drugWeighed : 0;
        return { lwq: lwq.toFixed(1), drugWeighed: drugWeighed.toFixed(1), aliquotWeight: aliquotWeight.toFixed(1) };
      };

      const calcC13 = () => {
        const vol = parseFloat(c13VolumeMl) || 0;
        const hr = parseFloat(c13TimeHours) || 1;
        const df = parseFloat(c13DropFactor) || 15;
        const mlPerHour = hr > 0 ? vol / hr : 0;
        const gttPerMin = hr > 0 ? (vol * df) / (hr * 60) : 0;
        return { mlPerHour: mlPerHour.toFixed(1), gttPerMin: gttPerMin.toFixed(0) };
      };

      const calcC14 = () => {
        const drugG = parseFloat(c14DrugWeightG) || 0;
        const eVal = parseFloat(c14EValue) || 0;
        const vol = parseFloat(c14FinalVolumeMl) || 0;
        const naclNeededTotal = 0.009 * vol; // สำหรับ Isotonic 0.9% NaCl
        const naclEquivFromDrug = drugG * eVal;
        const naclToAdd = naclNeededTotal - naclEquivFromDrug;
        return { naclNeededTotal: naclNeededTotal.toFixed(3), naclEquivFromDrug: naclEquivFromDrug.toFixed(3), naclToAdd: (naclToAdd > 0 ? naclToAdd : 0).toFixed(3) };
      };

                <div className="space-y-1.5 max-h-[620px] overflow-y-auto pr-1 no-scrollbar text-xs">

                            <Icons.ChevronRight className={`w-3.5 h-3.5 ${isSelected ? 'text-amber-500' : 'opacity-40'}`} />
                          )}
                        </div>
                      </div>

                }`}>
                  <div className="flex items-center gap-2 mb-2">
                    <Icons.Bookmark className="w-4 h-4 text-amber-500" />
                    <span className="text-xs font-bold">เอกสารอ้างอิงฉบับสมบูรณ์</span>
                  </div>
                  <p className="text-[11px] text-stone-400 leading-relaxed mb-3">
